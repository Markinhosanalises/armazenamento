<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Central - Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  }
  .login-box {
    background: #1e293b;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 360px;
    border: 1px solid #334155;
  }
  .login-box h1 {
    color: #f1f5f9;
    font-size: 22px;
    margin-bottom: 6px;
    text-align: center;
  }
  .login-box p {
    color: #94a3b8;
    font-size: 13px;
    text-align: center;
    margin-bottom: 24px;
  }
  .campo { margin-bottom: 16px; }
  .campo label {
    display: block;
    color: #cbd5e1;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .campo input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 14px;
  }
  .campo input:focus { outline: none; border-color: #3b82f6; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .erro {
    color: #f87171;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    display: none;
  }
</style>
</head>
<body>

<div class="login-box">
  <h1>Painel Central</h1>
  <p>Acesso restrito</p>

  <div class="campo">
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com">
  </div>

  <div class="campo">
    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha">
  </div>

  <button id="btnEntrar" onclick="fazerLogin()">Entrar</button>

  <p class="erro" id="mensagemErro"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const auth = firebase.auth();

  // Se já estiver logado, vai direto pro painel
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = 'painel.html';
  });

  function fazerLogin() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();
    const erro = document.getElementById('mensagemErro');
    const btn = document.getElementById('btnEntrar');

    erro.style.display = 'none';

    if (email === '' || senha === '') {
      erro.textContent = 'Preencha e-mail e senha.';
      erro.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    auth.signInWithEmailAndPassword(email, senha)
      .then(() => {
        window.location.href = 'painel.html';
      })
      .catch((error) => {
        erro.textContent = 'E-mail ou senha incorretos.';
        erro.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      });
  }

  document.getElementById('senha').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') fazerLogin();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>

</body>
</html>
