<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Central</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0f172a; color: #f1f5f9; min-height: 100vh; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
  }
  header h1 { font-size: 18px; }
  header button {
    background: #334155;
    color: #f1f5f9;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: #475569; }

  .abas {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    overflow-x: auto;
  }
  .aba {
    padding: 12px 18px;
    cursor: pointer;
    color: #94a3b8;
    font-size: 14px;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .aba:hover { color: #f1f5f9; }
  .aba.ativa { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }
  .aba .engrenagem {
    opacity: 0.5;
    font-size: 12px;
  }
  .aba .engrenagem:hover { opacity: 1; }
  .aba-nova {
    padding: 12px 18px;
    cursor: pointer;
    color: #3b82f6;
    font-size: 20px;
    font-weight: bold;
  }

  main { padding: 24px; max-width: 1100px; margin: 0 auto; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .toolbar input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #f1f5f9;
  }
  .btn-primario {
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primario:hover { background: #2563eb; }
  .btn-secundario {
    background: #334155;
    color: #f1f5f9;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-secundario:hover { background: #475569; }

  .grid-itens {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card-item {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 16px;
  }
  .card-item h3 { font-size: 15px; margin-bottom: 10px; color: #f1f5f9; }
  .card-item .linha {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    word-break: break-word;
  }
  .card-item .linha b { color: #cbd5e1; }
  .card-item .linha a { color: #60a5fa; }
  .card-item .acoes {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .card-item .acoes button {
    flex: 1;
    padding: 6px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .btn-editar { background: #334155; color: #f1f5f9; }
  .btn-excluir { background: #7f1d1d; color: #fecaca; }

  .senha-campo { display: flex; align-items: center; gap: 6px; }
  .senha-campo .toggle-senha { cursor: pointer; color: #60a5fa; font-size: 12px; }

  .vazio { color: #64748b; text-align: center; padding: 60px 0; font-size: 14px; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.aberto { display: flex; }
  .modal {
    background: #1e293b;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 440px;
    max-height: 85vh;
    overflow-y: auto;
    border: 1px solid #334155;
  }
  .modal h2 { font-size: 17px; margin-bottom: 18px; }
  .modal .campo { margin-bottom: 14px; }
  .modal .campo label {
    display: block;
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 5px;
  }
  .modal .campo input, .modal .campo select {
    width: 100%;
    padding: 9px 12px;
    border-radius: 7px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 14px;
  }
  .modal .acoes-modal {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal .acoes-modal button { flex: 1; }

  .construtor-campo {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    align-items: center;
  }
  .construtor-campo input { flex: 2; }
  .construtor-campo select { flex: 1; }
  .construtor-campo .remover-campo {
    background: #7f1d1d;
    color: #fecaca;
    border: none;
    width: 30px;
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <h1>📦 Painel Central</h1>
  <button onclick="fazerLogout()">Sair</button>
</header>

<div class="abas" id="listaAbas"></div>

<main>
  <div class="toolbar">
    <input type="text" id="busca" placeholder="Buscar..." oninput="renderizarItens()">
    <button class="btn-primario" onclick="abrirModalItem()">+ Adicionar</button>
  </div>

  <div class="grid-itens" id="gridItens"></div>
  <div class="vazio" id="mensagemVazia" style="display:none;">Nenhum item cadastrado ainda.</div>
</main>

<!-- Modal de Item -->
<div class="overlay" id="overlayItem">
  <div class="modal">
    <h2 id="tituloModalItem">Adicionar item</h2>
    <div id="camposFormItem"></div>
    <div class="acoes-modal">
      <button class="btn-secundario" onclick="fecharModalItem()">Cancelar</button>
      <button class="btn-primario" onclick="salvarItem()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal de Aba (criar/editar) -->
<div class="overlay" id="overlayAba">
  <div class="modal">
    <h2 id="tituloModalAba">Nova aba</h2>
    <div class="campo">
      <label>Nome da aba</label>
      <input type="text" id="nomeAba" placeholder="Ex: Domínios">
    </div>
    <label style="display:block; font-size:13px; color:#cbd5e1; margin-bottom:8px;">Campos desta aba</label>
    <div id="construtorCampos"></div>
    <button class="btn-secundario" style="width:100%; margin-bottom:10px;" onclick="adicionarCampoConstrutor()">+ Adicionar campo</button>
    <div class="acoes-modal">
      <button class="btn-secundario" onclick="fecharModalAba()">Cancelar</button>
      <button class="btn-primario" onclick="salvarAba()">Salvar aba</button>
    </div>
    <button id="btnExcluirAba" class="btn-excluir" style="width:100%; margin-top:10px; display:none; padding:10px; border-radius:8px;" onclick="excluirAbaAtual()">Excluir esta aba</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="painel.js"></script>
</body>
</html>
